[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "huyou-mcp"
version = "0.1.0"
description = "MCP server for Sohu Huyou (狐友) campus circles: read feeds, watch alumni, notify by mail"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "fishOfOUC" }]
keywords = ["mcp", "sohu", "huyou", "campus", "crawler", "qq-mail"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Communications :: Email",
]
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
huyou-mcp = "huyou_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
